name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.DB_DATABASE }}
          MYSQL_USER: ${{ secrets.DB_USERNAME }}
          MYSQL_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, bcmath, xml, ctype, json, tokenizer
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader
        working-directory: ./backend

      - name: Copy environment file
        run: cp .env.example .env
        working-directory: ./backend

      - name: Configure environment
        run: |
          sed -i "s/DB_CONNECTION=.*/DB_CONNECTION=mysql/" .env
          sed -i "s/DB_HOST=.*/DB_HOST=127.0.0.1/" .env
          sed -i "s/DB_PORT=.*/DB_PORT=3306/" .env
          sed -i "s/DB_DATABASE=.*/DB_DATABASE=${{ secrets.DB_DATABASE }}/" .env
          sed -i "s/DB_USERNAME=.*/DB_USERNAME=${{ secrets.DB_USERNAME }}/" .env
          sed -i "s/DB_PASSWORD=.*/DB_PASSWORD=${{ secrets.DB_PASSWORD }}/" .env
          sed -i "s/APP_ENV=.*/APP_ENV=testing/" .env
          sed -i "s/SESSION_DRIVER=.*/SESSION_DRIVER=array/" .env
          sed -i "s/CACHE_STORE=.*/CACHE_STORE=array/" .env
          sed -i "s/QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/" .env
        working-directory: ./backend

      - name: Generate application key
        run: php artisan key:generate
        working-directory: ./backend

      - name: Wait for MySQL
        run: |
          sleep 15
          for i in {1..60}; do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -u${{ secrets.DB_USERNAME }} -p${{ secrets.DB_PASSWORD }} --silent; then
              echo "MySQL is ready"
              break
            fi
            echo "Waiting for MySQL... ($i/60)"
            sleep 3
          done

      - name: Verify database connection
        run: |
          mysql -h 127.0.0.1 -P 3306 -u${{ secrets.DB_USERNAME }} -p${{ secrets.DB_PASSWORD }} -e "USE ${{ secrets.DB_DATABASE }}; SHOW TABLES;"
        working-directory: ./backend

      - name: Run migrations
        run: php artisan migrate --force
        working-directory: ./backend

      - name: Run seeders
        run: php artisan db:seed --force
        working-directory: ./backend

      - name: Run tests
        run: php artisan test
        working-directory: ./backend

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./front

      - name: Build frontend
        run: npm run build
        working-directory: ./front

      - name: Run lint
        run: npm run lint
        working-directory: ./front