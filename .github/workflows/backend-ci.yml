name: Backend CI

on:
  push:
    branches: [main, master]
    paths:
      - "backend/**"
  pull_request:
    branches: [main, master]
    paths:
      - "backend/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, xml, json, mysql, pdo, tokenizer, curl, gd, zip, bcmath, intl, fileinfo, dom, ctype, filter, hash, iconv, openssl, simplexml, xmlwriter, soap, sockets, pcntl, date, ftp, gmp, pcov
          ini-values: post_max_size=256M, upload_max_filesize=256M, memory_limit=512M

      - name: Copy .env
        run: cp backend/.env.example backend/.env

      - name: Install dependencies
        run: |
          cd backend
          composer install --no-interaction --prefer-dist --no-progress --ignore-platform-reqs

      - name: Generate key
        run: |
          cd backend
          php artisan key:generate

      - name: Run migrations
        run: |
          cd backend
          php artisan migrate --force

      - name: Run seeders
        run: |
          cd backend
          php artisan db:seed --force

      - name: Run tests
        run: |
          cd backend
          php artisan test --no-interaction

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
      - name: Deploy to AWS Server
        uses: appleboy/ssh-action@master
        with:
          host: 13.61.173.10
          username: ubuntu
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            cd /var/www/html
            git pull origin main
            composer install --no-dev --optimize-autoloader
            php artisan migrate --force
            php artisan optimize:clear