"A datetime string with format `Y-m-d H:i:s`, e.g. `2018-05-23 13:43:32`."
scalar DateTime @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTime")

"Indicates what fields are available at the top level of a query operation."
type Query @guard {
    "Find a single user by an identifying attribute."
    user(
      "Search by primary key."
      id: ID @eq @rules(apply: ["prohibits:email", "required_without:email"])

      "Search by email address."
      email: String @eq @rules(apply: ["prohibits:id", "required_without:id", "email"])
    ): User @find @can(ability: "view")

    "List multiple users."
    users(
      "Filters by name. Accepts SQL LIKE wildcards `%` and `_`."
      name: String @where(operator: "like")
    ): [User!]! @paginate(defaultCount: 10) @can(ability: "viewAny")

    "Find a single document by its ID."
    document(id: ID @eq): Document @find @can(ability: "view", find: "id")

    "List multiple documents."
    documents: [Document!]! @paginate(defaultCount: 10) @whereAuth(relation: "user")
}

"Account of a person who uses this application."
type User {
    "Unique primary key."
    id: ID!

    "Non-unique name."
    name: String!

    "Unique email address."
    email: String!

    "When the email was verified."
    email_verified_at: DateTime

    "When the account was created."
    created_at: DateTime!

    "When the account was last updated."
    updated_at: DateTime!

    "Documents belonging to this user."
    documents: [Document!]! @hasMany
}

"A document uploaded or generated by a user."
type Document {
    "Unique primary key."
    id: ID!

    "The user who owns the document."
    user: User! @belongsTo

    "The name of the document."
    name: String!

    "The path to the file in storage."
    file_path: String

    "The type of the file (e.g., pdf, docx)."
    file_type: String

    "The size of the file in bytes."
    file_size: Int

    "The text content of the document."
    content: String

    "The type/category of document."
    type: String

    "When the document was created."
    created_at: DateTime!

    "When the document was last updated."
    updated_at: DateTime!
}
